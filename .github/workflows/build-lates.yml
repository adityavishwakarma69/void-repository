name: Build And Deploy Packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install dependencies
        run: |
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/

          xbps-install -Sy \
            xbps \
            git \
            bash \
            shadow \
            sudo \
            xtools \
            66-devel \
            python3

      - name: Create builder
        run: |
          useradd -m -G xbuilder builder
          chown -R builder:builder "$GITHUB_WORKSPACE/source"

      - name: Build packages
        working-directory: source
        run: |
          sudo -Eu builder \
            python3 -m scripts.packager \
            --workspace /tmp/work \
            --target "$GITHUB_WORKSPACE/source/out" \
            --arch x86_64 aarch64

      - name: Checkout Repository
        uses: actions/upload-artifact@v4
        with:
          ref: repository
          path: repository

      - name: Debug checkout
        run: |
          echo "Workspace:"
          ls -la "$GITHUB_WORKSPACE"

          echo
          echo "Repository directory:"
          ls -la "$GITHUB_WORKSPACE/repository"

          echo
          echo "Git status:"
          git -C "$GITHUB_WORKSPACE/repository" status

      - name: Merge packages
        working-directory: source
        run: |
          python3 -m scripts.repository \
          --packages "$GITHUB_WORKSPACE/source/out" \
          --repository "$GITHUB_WORKSPACE/repository"

      - name: Commit and push
        working-directory: repository
        run: |
          pwd
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Repository already up to date."
            exit 0
          fi

          git commit -m "Update repository"
          git push
