name: Build And Deploy Packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install dependencies
        run: |
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/

          xbps-install -Sy \
            xbps \
            git \
            bash \
            shadow \
            sudo \
            xtools \
            66-devel \
            python3

      - name: Create builder
        run: |
          useradd -m -G xbuilder builder
          chown -R builder:builder "$GITHUB_WORKSPACE/source"

      - name: Build packages
        working-directory: source
        run: |
          sudo -Eu builder \
            python3 -m scripts.packager \
            --workspace /tmp/work \
            --target "$GITHUB_WORKSPACE/source/out" \
            --arch x86_64

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: repository
          path: repository

      - name: Fetch signing key
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: |
          install -d -m 700 /tmp/xbps-signing
          printf '%s' "$XBPS_PRIVATE_KEY" > /tmp/xbps-signing/repository.pem
          chmod 600 /tmp/xbps-signing/repository.pem

      - name: Merge packages
        working-directory: source
        env:
          SIGNER: "${{ github.repository_owner }} (auto)"
        run: |
          python3 -m scripts.repository \
          --packages "$GITHUB_WORKSPACE/source/out" \
          --repository "$GITHUB_WORKSPACE/repository" \
          --key "/tmp/xbps-signing/repository.pem" \
          --signedby "$SIGNER"

      - name: Commit and push
        working-directory: repository
        run: |
          pwd
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Repository already up to date."
            exit 0
          fi

          git commit -m "Update repository"
          git push
